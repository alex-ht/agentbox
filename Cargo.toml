[package]
name = "agentbox"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
resolver = "3"
description = "Busybox-style CLI toolkit for small language-model agents"
license = "MIT"
repository = "https://github.com/alex-ht/agentbox"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "charset", "gzip"] }
htmd = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
similar = "2"
encoding_rs = "0.8"
html5ever = "0.27"
markup5ever_rcdom = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
